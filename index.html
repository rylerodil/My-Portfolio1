<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <title>Rylee Rodil | Portfolio</title>
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header>

        <div class="logo">

            <span class="logo-icon">&lt;/&gt;</span>

            <span
                contenteditable="true"
                class="editable-name"
                id="nameTop"
                spellcheck="false">
                Rylee Rodil
            </span>

        </div>

        <nav>

            <a href="index.html" class="active">
                Home
            </a>

            <a href="quiz.html">
                Quiz
            </a>

            <a href="laboratory.html">
                Laboratory
            </a>

            <a href="exam.html">
                Exam
            </a>

            <a href="contact.html">
                Contact
            </a>

        </nav>

    </header>


    <!-- ================= HOME ================= -->

    <main>

        <section class="home" id="home">

            <div class="background-circle circle-one"></div>
            <div class="background-circle circle-two"></div>
            <div class="background-circle circle-three"></div>


            <!-- PROFILE IMAGE -->

            <div class="home-img">

                <div class="image-frame">

                    <img
                        id="profileImage"
                        src=""
                        alt="Profile Picture">

                    <input
                        type="file"
                        id="imageInput"
                        accept="image/*"
                        hidden>

                </div>


                <label
                    for="imageInput"
                    class="image-upload-button">

                    <i class="fa-solid fa-camera"></i>

                    Choose Picture

                </label>


                <p class="image-note">

                    <i class="fa-solid fa-image"></i>

                    Click "Choose Picture" to upload

                </p>

            </div>


            <!-- HOME CONTENT -->

            <div class="home-content">

                <div class="portfolio-label">

                    <i class="fa-solid fa-code"></i>

                    MY PORTFOLIO

                </div>


                <h1>

                    Hi, I'm

                    <span id="mainName">
                        Rylee
                    </span>

                </h1>


                <h3>

                    <span class="terminal-symbol">
                        &gt;_
                    </span>

                    IT Student

                </h3>


                <div class="editable-box">

                    <textarea
                        id="homeDescription"
                        rows="5"
                        placeholder="Write something about yourself...">Welcome to my portfolio. Explore my work, activities, and projects as I continue learning and improving my skills in programming and technology.</textarea>

                </div>


                <!-- SOCIAL MEDIA -->

                <div class="social-icons">

                    <a
                        href="https://www.facebook.com/rylee.rodil.355"
                        target="_blank"
                        rel="noopener noreferrer"
                        title="Facebook">

                        <i class="fa-brands fa-facebook"></i>

                    </a>


                    <a
                        href="https://github.com/rylerodil/MY-PORTFOLIO"
                        target="_blank"
                        rel="noopener noreferrer"
                        title="GitHub">

                        <i class="fa-brands fa-github"></i>

                    </a>


                    <a
                        href="https://www.instagram.com/rjr.ryy/"
                        target="_blank"
                        rel="noopener noreferrer"
                        title="Instagram">

                        <i class="fa-brands fa-instagram"></i>

                    </a>

                </div>

            </div>

        </section>


        <!-- ================= ABOUT ================= -->

        <section
            class="about-section"
            id="about">

            <div class="about-background-grid"></div>


            <div class="about-me">

                <div class="about-content">

                    <div class="about-small-title">

                        GET TO KNOW ME

                    </div>


                    <h2>

                        About

                        <span>
                            Me
                        </span>

                    </h2>


                    <div class="purple-line"></div>


                    <textarea
                        id="aboutDescription"
                        rows="8"
                        placeholder="Write something about yourself...">I'm Rylee Rodil, an IT student who is interested in programming and technology. I enjoy visiting different places, exploring new environments, and experiencing new things. I am currently learning how to code and improving my programming skills. I know I still have a lot to learn, but I am willing to practice, explore, and challenge myself to become better at programming in the future.</textarea>


                    <div class="about-tags">

                        <span>

                            <i class="fa-solid fa-code"></i>

                            Programming

                        </span>


                        <span>

                            <i class="fa-solid fa-laptop"></i>

                            Technology

                        </span>


                        <span>

                            <i class="fa-solid fa-location-dot"></i>

                            Exploring

                        </span>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer>

        <p>
            © 2026 Rylee Rodil
        </p>

        <span>
            Designed with HTML & CSS
        </span>

    </footer>


    <!-- ================= IMAGE ZOOM MODAL ================= -->

    <div id="imageModal"
         style="
            display:none;
            position:fixed;
            inset:0;
            background:rgba(0,0,0,.92);
            z-index:9999;
            align-items:center;
            justify-content:center;
            padding:30px;
         ">

        <button
            id="closeModal"
            style="
                position:absolute;
                top:25px;
                right:35px;
                background:none;
                color:white;
                font-size:35px;
                cursor:pointer;
                z-index:10000;
            ">

            <i class="fa-solid fa-xmark"></i>

        </button>

        <img
            id="modalImage"
            src=""
            alt="Zoomed Image"
            style="
                max-width:90%;
                max-height:90%;
                object-fit:contain;
                border-radius:12px;
                box-shadow:0 0 50px rgba(168,85,247,.4);
            ">

    </div>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        /* =====================================================
           NAME
        ===================================================== */

        const nameTop =
            document.getElementById("nameTop");

        const mainName =
            document.getElementById("mainName");


        function updateMainName() {

            const fullName =
                nameTop.textContent.trim();

            if (fullName === "") {

                mainName.textContent = "Name";

                return;

            }

            const firstName =
                fullName.split(/\s+/)[0];

            mainName.textContent =
                firstName;

        }


        nameTop.addEventListener("input", function () {

            updateMainName();

            localStorage.setItem(
                "portfolioName",
                nameTop.textContent
            );

        });


        nameTop.addEventListener("keydown", function(event) {

            if (event.key === "Enter") {

                event.preventDefault();

                nameTop.blur();

            }

        });


        nameTop.addEventListener("click", function(event) {

            event.stopPropagation();

        });


        nameTop.addEventListener("mousedown", function(event) {

            event.stopPropagation();

        });


        /* =====================================================
           LOAD NAME
        ===================================================== */

        const savedName =
            localStorage.getItem("portfolioName");

        if (savedName !== null) {

            nameTop.textContent =
                savedName;

        }

        updateMainName();


        /* =====================================================
           PROFILE IMAGE
        ===================================================== */

        const imageInput =
            document.getElementById("imageInput");

        const profileImage =
            document.getElementById("profileImage");


        const savedProfileImage =
            localStorage.getItem("profileImage");


        if (savedProfileImage) {

            profileImage.src =
                savedProfileImage;

        }


        imageInput.addEventListener("change", function() {

            const file =
                this.files[0];

            if (!file) {
                return;
            }


            if (!file.type.startsWith("image/")) {

                alert(
                    "Please select an image file."
                );

                this.value = "";

                return;

            }


            const reader =
                new FileReader();


            reader.onload =
                function(event) {

                    profileImage.src =
                        event.target.result;

                    localStorage.setItem(
                        "profileImage",
                        event.target.result
                    );

                };


            reader.readAsDataURL(file);

        });


        /* =====================================================
           HOME TEXT
        ===================================================== */

        const homeDescription =
            document.getElementById("homeDescription");


        const savedHomeDescription =
            localStorage.getItem("homeDescription");


        if (savedHomeDescription !== null) {

            homeDescription.value =
                savedHomeDescription;

        }


        homeDescription.addEventListener("input", function() {

            localStorage.setItem(
                "homeDescription",
                homeDescription.value
            );

        });


        /* =====================================================
           ABOUT TEXT
        ===================================================== */

        const aboutDescription =
            document.getElementById("aboutDescription");


        const savedAboutDescription =
            localStorage.getItem("aboutDescription");


        if (savedAboutDescription !== null) {

            aboutDescription.value =
                savedAboutDescription;

        }


        aboutDescription.addEventListener("input", function() {

            localStorage.setItem(
                "aboutDescription",
                aboutDescription.value
            );

        });


        /* =====================================================
           IMAGE ZOOM
        ===================================================== */

        const imageModal =
            document.getElementById("imageModal");

        const modalImage =
            document.getElementById("modalImage");

        const closeModal =
            document.getElementById("closeModal");


        profileImage.addEventListener("click", function() {

            if (!profileImage.src) {
                return;
            }

            imageModal.style.display =
                "flex";

            modalImage.src =
                profileImage.src;

        });


        closeModal.addEventListener("click", function() {

            imageModal.style.display =
                "none";

        });


        imageModal.addEventListener("click", function(event) {

            if (event.target === imageModal) {

                imageModal.style.display =
                    "none";

            }

        });

    </script>

</body>

</html>
