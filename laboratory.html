<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
    <title>Laboratory | Rylee Rodil</title>
    <style>
        /* Add styles for document previews */
        .document-preview {
            display: flex;
            align-items: center;
            margin: 5px 0;
            font-family: Arial, sans-serif;
        }
        .document-preview i {
            margin-right: 8px;
            color: #555;
            font-size: 24px;
        }
        /* Optional: style for images in preview */
        #laboratoryPreview img {
            max-width: 150px;
            max-height: 150px;
            margin: 5px;
            border-radius: 8px;
            object-fit: cover;
        }
        /* Styling for submission cards (optional) */
        .submission-card {
            border: 1px solid #ccc;
            padding: 10px;
            border-radius: 8px;
            margin: 10px;
            width: 200px;
            display: inline-block;
            vertical-align: top;
            text-align: center;
        }
        .submission-card img {
            max-width: 100%;
            max-height: 100px;
            border-radius: 4px;
            cursor: pointer;
        }
        /* Style for delete button inside card */
        .delete-button {
            background: transparent;
            border: none;
            color: red;
            cursor: pointer;
            margin-top: 8px;
        }
    </style>
</head>

<body>
    <!-- ================= NAVIGATION ================= -->
    <header>
        <a href="index.html" class="logo">Rylee Rodil</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="quiz.html">Quiz</a>
            <a href="laboratory.html" class="active">Laboratory</a>
            <a href="exam.html">Exam</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <!-- ================= LABORATORY PAGE ================= -->
    <section class="portfolio-page">
        <div class="page-title">
            <h1>My <span>Laboratory</span></h1>
            <p>This page contains my laboratory activities and submitted laboratory pictures.</p>
        </div>

        <!-- ================= UPLOAD BOX ================= -->
        <div class="upload-container">
            <div class="upload-icon">
                <i class="fa-solid fa-laptop-code"></i>
            </div>
            <h2>Submit Your Laboratory Activities</h2>
            <p>Select one or multiple pictures or documents of your laboratory activities.</p>
            <input
                type="file"
                id="laboratoryImage"
                accept="image/*,application/pdf,.doc,.docx"
                multiple
                <embed src="RODIL_LAB1.pdf" type="application/pdf" width="600" height=400"/>
            />
            <label for="laboratoryImage" class="upload-button">
                <i class="fa-solid fa-images"></i> Choose Files
                <embed src="RODIL_LAB1.pdf" type="application/pdf" width="600" height=400"/>
            </label>
            <!-- PREVIEW -->
            <div id="laboratoryPreview" class="preview-gallery"></div>
            <!-- SUBMIT -->
            <button class="submit-button" onclick="submitLaboratories()">
                <i class="fa-solid fa-cloud-arrow-up"></i> Submit Laboratory
                <embed src="RODIL_LAB1.pdf" type="application/pdf" width="600" height=400"/>
            </button>
        </div>

        <!-- ================= SUBMITTED LABORATORIES ================= -->
        <div class="submission-gallery" id="laboratoryGallery"></div>
    </section>

    <!-- ================= IMAGE/FILE ZOOM MODAL ================= -->
    <div
        id="imageModal"
        style="
            display:none;
            position:fixed;
            inset:0;
            background:rgba(0,0,0,.92);
            z-index:9999;
            align-items:center;
            justify-content:center;
            padding:30px;
        "
    >
        <button
            id="closeModal"
            style="
                position:absolute;
                top:25px;
                right:35px;
                background:none;
                color:white;
                font-size:35px;
                cursor:pointer;
                z-index:10000;
            "
        >
            <i class="fa-solid fa-xmark"></i>
        </button>
        <img
            id="modalImage"
            src=""
            alt="Zoomed Image"
            style="
                max-width:90%;
                max-height:90%;
                object-fit:contain;
                border-radius:12px;
                box-shadow:0 0 50px rgba(168,85,247,.4);
            "
        />
    </div>

    <!-- ================= JAVASCRIPT ================= -->
    <script>
        const laboratoryImage = document.getElementById("laboratoryImage");
        const laboratoryPreview = document.getElementById("laboratoryPreview");
        const laboratoryGallery = document.getElementById("laboratoryGallery");

        let selectedLaboratories = [];

        /* =====================================================
           LOAD SAVED LABORATORY PICTURES AND FILES
        ===================================================== */
        function loadLaboratories() {
            const savedLaboratories =
                JSON.parse(localStorage.getItem("laboratorySubmissions") || "[]");
            savedLaboratories.forEach(function (item) {
                createLaboratoryCard(item);
            });
        }

        /* =====================================================
           CREATE LABORATORY CARD
        ===================================================== */
        function createLaboratoryCard(item) {
            const card = document.createElement("div");
            card.className = "submission-card";

            if (item.type.startsWith("image/")) {
                // Image card
                card.innerHTML = `
                    <img src="${item.data}" alt="Laboratory Submission" class="zoomable-image" />
                    <h3>Laboratory Activity</h3>
                    <p>Successfully submitted.</p>
                    <button class="delete-button"><i class="fa-solid fa-trash"></i> Remove</button>
                `;

                // Zoom on image click
                const img = card.querySelector("img");
                img.addEventListener("click", () => {
                    openImageModal(item.data);
                });
            } else {
                // Document card
                card.innerHTML = `
                    <div class="document-preview">
                        <i class="fa-solid fa-file"></i> ${item.name}
                    </div>
                    <h3>Document</h3>
                    <p>Successfully submitted.</p>
                    <button class="delete-button"><i class="fa-solid fa-trash"></i> Remove</button>
                `;
            }

            // Delete button event
            const deleteButton = card.querySelector(".delete-button");
            deleteButton.addEventListener("click", () => {
                if (confirm("Are you sure you want to delete this?")) {
                    card.remove();
                    removeLaboratoryFromStorage(item);
                }
            });

            laboratoryGallery.appendChild(card);
        }

        /* =====================================================
           REMOVE FROM STORAGE
        ===================================================== */
        function removeLaboratoryFromStorage(item) {
            let savedLaboratories =
                JSON.parse(localStorage.getItem("laboratorySubmissions") || "[]");
            savedLaboratories = savedLaboratories.filter(function (i) {
                return !(i.data === item.data && i.name === item.name);
            });
            localStorage.setItem("laboratorySubmissions", JSON.stringify(savedLaboratories));
        }

        /* =====================================================
           HANDLE FILE SELECTION
        ===================================================== */
        laboratoryImage.addEventListener("change", function () {
            selectedLaboratories = Array.from(this.files);
            laboratoryPreview.innerHTML = "";

            selectedLaboratories.forEach(function (file) {
                if (
                    !file.type.startsWith("image/") &&
                    !file.type.startsWith("application/") &&
                    file.type !== "application/pdf" &&
                    file.name.split('.').pop().toLowerCase() !== "doc" &&
                    file.name.split('.').pop().toLowerCase() !== "docx"
                ) {
                    alert("Unsupported file type: " + file.name);
                    return;
                }

                const reader = new FileReader();

                reader.onload = function (event) {
                    if (file.type.startsWith("image/")) {
                        // Image preview
                        const img = document.createElement("img");
                        img.src = event.target.result;
                        img.alt = "Laboratory Preview";
                        laboratoryPreview.appendChild(img);
                    } else {
                        // Document preview
                        const docDiv = document.createElement("div");
                        docDiv.className = "document-preview";
                        docDiv.innerHTML = `
                            <i class="fa-solid fa-file"></i> ${file.name}
                        `;
                        laboratoryPreview.appendChild(docDiv);
                    }
                };

                reader.readAsDataURL(file);
            });
        });

        /* =====================================================
           SUBMIT LABORATORIES
        ===================================================== */
        function submitLaboratories() {
            if (selectedLaboratories.length === 0) {
                alert("Please choose at least one laboratory picture or document.");
                return;
            }

            let savedLaboratories =
                JSON.parse(localStorage.getItem("laboratorySubmissions") || "[]");
            let completed = 0;

            selectedLaboratories.forEach(function (file) {
                const reader = new FileReader();

                reader.onload = function (event) {
                    const dataURL = event.target.result;
                    const item = {
                        name: file.name,
                        type: file.type,
                        data: dataURL,
                    };
                    savedLaboratories.push(item);
                    createLaboratoryCard(item);
                    completed++;
                    if (completed === selectedLaboratories.length) {
                        localStorage.setItem("laboratorySubmissions", JSON.stringify(savedLaboratories));
                        alert(selectedLaboratories.length + " item(s) submitted successfully!");
                        // Reset input and preview
                        document.getElementById("laboratoryImage").value = "";
                        selectedLaboratories = [];
                        laboratoryPreview.innerHTML = "";
                    }
                };

                reader.readAsDataURL(file);
            });
        }

        /* ================= IMAGE MODAL ================= */
        const imageModal = document.getElementById("imageModal");
        const modalImage = document.getElementById("modalImage");
        const closeModal = document.getElementById("closeModal");

        function openImageModal(imageSrc) {
            modalImage.src = imageSrc;
            imageModal.style.display = "flex";
        }

        closeModal.addEventListener("click", () => {
            imageModal.style.display = "none";
        });

        imageModal.addEventListener("click", (event) => {
            if (event.target === imageModal) {
                imageModal.style.display = "none";
            }
        });

        // Load saved data on page load
        loadLaboratories();
    </script>
</body>
</html>
