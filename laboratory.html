<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet"
          href="style.css">

    <title>Laboratory | Rylee Rodil</title>

</head>

<body>


    <!-- ================= NAVIGATION ================= -->

    <header>

        <a href="index.html" class="logo">
            Rylee Rodil
        </a>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="quiz.html">
                Quiz
            </a>

            <a href="laboratory.html" class="active">
                Laboratory
            </a>

            <a href="exam.html">
                Exam
            </a>

            <a href="contact.html">
                Contact
            </a>

        </nav>

    </header>


    <!-- ================= LABORATORY PAGE ================= -->

    <section class="portfolio-page">

        <div class="page-title">

            <h1>
                My <span>Laboratory</span>
            </h1>

            <p>
                This page contains my laboratory activities
                and submitted laboratory pictures.
            </p>

        </div>


        <!-- ================= UPLOAD BOX ================= -->

        <div class="upload-container">

            <div class="upload-icon">

                <i class="fa-solid fa-laptop-code"></i>

            </div>


            <h2>
                Submit Your Laboratory Activities
            </h2>


            <p>
                Select one or multiple pictures of your laboratory activities.
            </p>


            <input
                type="file"
                id="laboratoryImage"
                accept="image/*"
                multiple>


            <label
                for="laboratoryImage"
                class="upload-button">

                <i class="fa-solid fa-images"></i>

                Choose Pictures

            </label>


            <!-- PREVIEW -->

            <div
                id="laboratoryPreview"
                class="preview-gallery">
            </div>


            <!-- SUBMIT -->

            <button
                class="submit-button"
                onclick="submitLaboratories()">

                <i class="fa-solid fa-cloud-arrow-up"></i>

                Submit Laboratory

            </button>

        </div>


        <!-- ================= SUBMITTED LABORATORIES ================= -->

        <div
            class="submission-gallery"
            id="laboratoryGallery">

        </div>

    </section>


    <!-- ================= IMAGE ZOOM MODAL ================= -->

    <div
        id="imageModal"
        style="
            display:none;
            position:fixed;
            inset:0;
            background:rgba(0,0,0,.92);
            z-index:9999;
            align-items:center;
            justify-content:center;
            padding:30px;
        ">

        <button
            id="closeModal"
            style="
                position:absolute;
                top:25px;
                right:35px;
                background:none;
                color:white;
                font-size:35px;
                cursor:pointer;
                z-index:10000;
            ">

            <i class="fa-solid fa-xmark"></i>

        </button>


        <img
            id="modalImage"
            src=""
            alt="Zoomed Image"
            style="
                max-width:90%;
                max-height:90%;
                object-fit:contain;
                border-radius:12px;
                box-shadow:0 0 50px rgba(168,85,247,.4);
            ">

    </div>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        const laboratoryImage =
            document.getElementById("laboratoryImage");

        const laboratoryPreview =
            document.getElementById("laboratoryPreview");

        const laboratoryGallery =
            document.getElementById("laboratoryGallery");


        let selectedLaboratories = [];


        /* =====================================================
           LOAD SAVED LABORATORY PICTURES
        ===================================================== */

        function loadLaboratories() {

            const savedLaboratories =
                JSON.parse(
                    localStorage.getItem(
                        "laboratorySubmissions"
                    ) || "[]"
                );


            savedLaboratories.forEach(
                function(imageData) {

                    createLaboratoryCard(
                        imageData
                    );

                }
            );

        }


        /* =====================================================
           CREATE LABORATORY CARD
        ===================================================== */

        function createLaboratoryCard(imageData) {

            const card =
                document.createElement("div");

            card.className =
                "submission-card";


            card.innerHTML = `

                <img
                    src="${imageData}"
                    alt="Laboratory Submission"
                    class="zoomable-image">

                <h3>
                    Laboratory Activity
                </h3>

                <p>
                    Successfully submitted.
                </p>

                <button
                    class="delete-button">

                    <i class="fa-solid fa-trash"></i>

                    Remove

                </button>

            `;


            const image =
                card.querySelector("img");


            const deleteButton =
                card.querySelector(".delete-button");


            /* ZOOM */

            image.addEventListener(
                "click",
                function() {

                    openImageModal(
                        imageData
                    );

                }
            );


            /* DELETE */

            deleteButton.addEventListener(
                "click",
                function() {

                    const answer =
                        confirm(
                            "Are you sure you want to delete this laboratory picture?"
                        );


                    if (!answer) {
                        return;
                    }


                    card.remove();

                    removeLaboratoryFromStorage(
                        imageData
                    );

                }
            );


            laboratoryGallery.appendChild(
                card
            );

        }


        /* =====================================================
           REMOVE FROM STORAGE
        ===================================================== */

        function removeLaboratoryFromStorage(
            imageData
        ) {

            let savedLaboratories =
                JSON.parse(
                    localStorage.getItem(
                        "laboratorySubmissions"
                    ) || "[]"
                );


            savedLaboratories =
                savedLaboratories.filter(
                    function(item) {

                        return item !== imageData;

                    }
                );


            localStorage.setItem(
                "laboratorySubmissions",
                JSON.stringify(
                    savedLaboratories
                )
            );

        }


        /* =====================================================
           SELECT MULTIPLE IMAGES
        ===================================================== */

        laboratoryImage.addEventListener(
            "change",
            function() {

                selectedLaboratories =
                    Array.from(this.files);


                laboratoryPreview.innerHTML =
                    "";


                selectedLaboratories.forEach(
                    function(file) {

                        if (
                            !file.type.startsWith("image/")
                        ) {

                            return;

                        }


                        const reader =
                            new FileReader();


                        reader.onload =
                            function(event) {

                                const img =
                                    document.createElement("img");


                                img.src =
                                    event.target.result;


                                img.alt =
                                    "Laboratory Preview";


                                laboratoryPreview.appendChild(
                                    img
                                );

                            };


                        reader.readAsDataURL(
                            file
                        );

                    }
                );

            }
        );


        /* =====================================================
           SUBMIT LABORATORIES
        ===================================================== */

        function submitLaboratories() {

            if (
                selectedLaboratories.length === 0
            ) {

                alert(
                    "Please choose at least one laboratory picture."
                );

                return;

            }


            let savedLaboratories =
                JSON.parse(
                    localStorage.getItem(
                        "laboratorySubmissions"
                    ) || "[]"
                );


            let completed = 0;


            selectedLaboratories.forEach(
                function(file) {

                    const reader =
                        new FileReader();


                    reader.onload =
                        function(event) {

                            const imageData =
                                event.target.result;


                            savedLaboratories.push(
                                imageData
                            );


                            createLaboratoryCard(
                                imageData
                            );


                            completed++;


                            if (
                                completed ===
                                selectedLaboratories.length
                            ) {

                                localStorage.setItem(
                                    "laboratorySubmissions",
                                    JSON.stringify(
                                        savedLaboratories
                                    )
                                );


                                alert(
                                    selectedLaboratories.length +
                                    " laboratory picture(s) submitted successfully!"
                                );


                                laboratoryImage.value =
                                    "";

                                selectedLaboratories =
                                    [];

                                laboratoryPreview.innerHTML =
                                    "";

                            }

                        };


                    reader.readAsDataURL(
                        file
                    );

                }
            );

        }


        /* =====================================================
           IMAGE MODAL
        ===================================================== */

        const imageModal =
            document.getElementById("imageModal");

        const modalImage =
            document.getElementById("modalImage");

        const closeModal =
            document.getElementById("closeModal");


        function openImageModal(
            imageData
        ) {

            modalImage.src =
                imageData;

            imageModal.style.display =
                "flex";

        }


        closeModal.addEventListener(
            "click",
            function() {

                imageModal.style.display =
                    "none";

            }
        );


        imageModal.addEventListener(
            "click",
            function(event) {

                if (
                    event.target === imageModal
                ) {

                    imageModal.style.display =
                        "none";

                }

            }
        );


        /* LOAD SAVED DATA */

        loadLaboratories();

    </script>

</body>

</html>
